<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golfbanor | Golfjakten</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/golfbanor.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
</head>

<body>
    <header class="toppbar">
        <div class="logo">GOLFJAKTEN</div>

        <nav class="nav">
            <a href="index.html">Startsida</a>
            <a href="golfbanor.html">Golfbanor</a>
            <a href="om.html">Om oss</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>

        <a href="Golfresor.html" class="header-btn">Planera golfresa</a>
    </header>

    <main class="golfbanor-sida">
        <section class="golfbanor-hero">
            <h1>Golfbanor</h1>
            <p>En lista och karta för alla golfbanor i Småland och Öland för att lätt hitta den som passar dig.</p>
        </section>

        <section class="golfbanor-top">
            <p><span id="antal-golfbanor">0</span> golfbanor</p>

            <div class="sortering">
                <label for="sortering">Sortera</label>
                <select id="sortering">
                    <option value="az">A–Ö</option>
                    <option value="za">Ö–A</option>
                </select>
            </div>
        </section>

        <section class="golfbanor-layout">
            <aside class="filter">
                <h2>Filtrera</h2>

                <label for="search">Sök golfbana</label>
                <input type="text" id="search" placeholder="Sök namn eller stad">

                <label for="prisFilter">Prisintervall</label>
                <select id="prisFilter">
                    <option value="all">Alla priser</option>
                    <option value="100-250">100–250 kr</option>
                    <option value="250-500">250–500 kr</option>
                </select>

                <label for="landskapFilter">Område</label>
                <select id="landskapFilter">
                    <option value="all">Alla områden</option>
                    <option value="Småland">Småland</option>
                    <option value="Öland">Öland</option>
                </select>

                <button id="reset">Rensa filter</button>
            </aside>

            <section class="lista-section">
                <div id="golf-list"></div>

                <div class="knappar">
                    <button id="visa-fler" class="visa-fler">Visa fler golfbanor</button>
                    <button id="hide" class="hide">Visa färre</button>
                </div>
            </section>

            <section class="karta-section">
                <div id="map"></div>

                <div id="golf-detaljer">
                    <p>Klicka på en golfbana för att visa mer information.</p>
                </div>
            </section>
        </section>
    </main>

    <footer>
        <div>
            <h2>GOLFJAKTEN</h2>
        </div>

        <div>
            <h4>kontakt</h4>
            <p>Nummer...</p>
            <p>Mail..</p>
        </div>
    </footer>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script type="module" src="js/golfbanor.js"></script>
</body>

</html>
